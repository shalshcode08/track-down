  <text x="736" y="490" font-family="'Courier New', monospace" font-size="13" fill="#71717a">Total · Today</text>
  <text x="1092" y="490" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="22" font-weight="800" fill="#fafafa" text-anchor="end">₹ 1,340</text>

