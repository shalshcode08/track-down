    <path d="M27 10V5.5a1.5 1.5 0 0 0-1.5-1.5H7A3 3 0 1 0 7 10h21a1.5 1.5 0 0 1 1.5 1.5V17h-4.5a3 3 0 1 0 0 6H29.5a1.5 1.5 0 0 0 1.5-1.5V11.5"/>
