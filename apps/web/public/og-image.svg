  <text x="736" y="418" font-family="'Courier New', monospace" font-size="11" fill="#71717a" opacity="0.6">Yesterday · Café</text>
  <text x="1092" y="410" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fafafa" opacity="0.6" text-anchor="end">₹ 80</text>

