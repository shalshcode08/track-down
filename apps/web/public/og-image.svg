    <circle cx="80" cy="240" r="1"/><circle cx="160" cy="240" r="1"/><circle cx="240" cy="240" r="1"/><circle cx="320" cy="240" r="1"/><circle cx="400" cy="240" r="1"/><circle cx="480" cy="240" r="1"/><circle cx="560" cy="240" r="1"/><circle cx="640" cy="240" r="1"/><circle cx="720" cy="240" r="1"/><circle cx="800" cy="240" r="1"/><circle cx="880" cy="240" r="1"/><circle cx="960" cy="240" r="1"/><circle cx="1040" cy="240" r="1"/><circle cx="1120" cy="240" r="1"/>
    <circle cx="80" cy="320" r="1"/><circle cx="160" cy="320" r="1"/><circle cx="240" cy="320" r="1"/><circle cx="320" cy="320" r="1"/><circle cx="400" cy="320" r="1"/><circle cx="480" cy="320" r="1"/><circle cx="560" cy="320" r="1"/><circle cx="640" cy="320" r="1"/><circle cx="720" cy="320" r="1"/><circle cx="800" cy="320" r="1"/><circle cx="880" cy="320" r="1"/><circle cx="960" cy="320" r="1"/><circle cx="1040" cy="320" r="1"/><circle cx="1120" cy="320" r="1"/>
    <circle cx="80" cy="400" r="1"/><circle cx="160" cy="400" r="1"/><circle cx="240" cy="400" r="1"/><circle cx="320" cy="400" r="1"/><circle cx="400" cy="400" r="1"/><circle cx="480" cy="400" r="1"/><circle cx="560" cy="400" r="1"/><circle cx="640" cy="400" r="1"/><circle cx="720" cy="400" r="1"/><circle cx="800" cy="400" r="1"/><circle cx="880" cy="400" r="1"/><circle cx="960" cy="400" r="1"/><circle cx="1040" cy="400" r="1"/><circle cx="1120" cy="400" r="1"/>
