<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ─── Primary SEO ──────────────────────────────────────────── -->
    <title>TrackDown — Expense Tracker via Telegram</title>
    <meta name="description" content="TrackDown is a personal expense tracker that lets you log spending instantly via Telegram and review your finances through a clean, minimal web dashboard. Free and open source." />
    <meta name="keywords" content="expense tracker, telegram bot, spending tracker, personal finance, budget tracker, trackdown, money manager, free expense tracker, open source finance" />
    <meta name="author" content="TrackDown" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="30 days" />
    <meta name="rating" content="general" />
    <link rel="canonical" href="https://trackdown.space/" />

    <!-- ─── Open Graph / Facebook ────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trackdown.space/" />
    <meta property="og:site_name" content="TrackDown" />
    <meta property="og:title" content="TrackDown — Expense Tracker via Telegram" />
    <meta property="og:description" content="Log expenses instantly via Telegram. Review, analyse, and manage your spending through a clean web dashboard. Free and open source." />
    <meta property="og:image" content="https://trackdown.space/og-image.svg" />
    <meta property="og:image:secure_url" content="https://trackdown.space/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TrackDown — Expense tracker showing recent expenses logged via Telegram bot" />
    <meta property="og:locale" content="en_US" />

    <!-- ─── Twitter / X Card ─────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrackDown — Expense Tracker via Telegram" />
    <meta name="twitter:description" content="Log expenses instantly via Telegram. Review, analyse, and manage your spending through a clean web dashboard. Free and open source." />
    <meta name="twitter:image" content="https://trackdown.space/og-image.svg" />
    <meta name="twitter:image:alt" content="TrackDown — Expense tracker showing recent expenses logged via Telegram bot" />

    <!-- ─── PWA & Mobile ─────────────────────────────────────────── -->
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrackDown" />
    <meta name="application-name" content="TrackDown" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#09090b" />

    <!-- ─── Icons & Manifest ─────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ─── Fonts ────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&display=swap" />

    <!-- ─── DNS prefetch for API ─────────────────────────────────── -->
    <link rel="dns-prefetch" href="https://api.trackdown.space" />
    <link rel="preconnect" href="https://api.trackdown.space" crossorigin />

    <!-- ─── JSON-LD: WebApplication ──────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TrackDown",
      "alternateName": "TrackDown Expense Tracker",
      "url": "https://trackdown.space",
      "description": "TrackDown is a personal expense tracker that lets you log spending instantly via Telegram and review your finances through a clean, minimal web dashboard.",
      "applicationCategory": "FinanceApplication",
      "applicationSubCategory": "Personal Finance",
      "operatingSystem": "Web, Android, iOS",
      "browserRequirements": "Requires JavaScript",
      "inLanguage": "en",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "shalshcode08",
        "url": "https://github.com/shalshcode08"
      },
      "featureList": [
        "Log expenses via Telegram bot",
        "Expense categories with emojis",
        "Daily spending summaries via Telegram",
        "Spending analytics and charts",
        "Date range filtering",
        "Free and open source"
      ],
      "screenshot": {
        "@type": "ImageObject",
        "url": "https://trackdown.space/og-image.svg",
        "width": "1200",
        "height": "630"
      },
      "potentialAction": {
        "@type": "UseAction",
        "target": "https://trackdown.space/login"
      }
    }
    </script>

    <!-- ─── JSON-LD: BreadcrumbList ──────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://trackdown.space/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Sign In",
          "item": "https://trackdown.space/login"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
